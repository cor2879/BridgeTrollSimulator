name: Deploy Bridge Troll Simulator WebGL

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag containing the WebGL zip"
        required: true
        default: "webgl-0.1.2"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Download WebGL release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release unpacked site

          gh release download "$RELEASE_TAG" \
            --pattern 'BridgeTrollSimulator.*-WebGL*.zip' \
            --dir release

          ZIP_FILE="$(find release -maxdepth 1 -type f -name '*.zip' -print -quit)"

          if [[ -z "$ZIP_FILE" ]]; then
            echo "No Bridge Troll Simulator WebGL zip found on release '$RELEASE_TAG'." >&2
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d unpacked

          INDEX_FILE="$(find unpacked -type f -name index.html -print -quit)"

          if [[ -z "$INDEX_FILE" ]]; then
            echo "The release zip does not contain index.html." >&2
            exit 1
          fi

          WEBGL_ROOT="$(dirname "$INDEX_FILE")"
          cp -a "$WEBGL_ROOT"/. site/

          # Replace Unity's stock wrapper with the mobile-safe wrapper proven
          # in Hunt the Muglump. The WebGL payload itself remains unchanged.
          cp .github/webgl-template/index.html site/index.html
          cp .github/webgl-template/style.css site/TemplateData/style.css

          LOADER_FILE="$(find site/Build -maxdepth 1 -type f -name '*.loader.js' -printf '%f\n' | head -n 1)"
          DATA_FILE="$(find site/Build -maxdepth 1 -type f -name '*.data.unityweb' -printf '%f\n' | head -n 1)"
          FRAMEWORK_FILE="$(find site/Build -maxdepth 1 -type f -name '*.framework.js.unityweb' -printf '%f\n' | head -n 1)"
          WASM_FILE="$(find site/Build -maxdepth 1 -type f -name '*.wasm.unityweb' -printf '%f\n' | head -n 1)"
          PRODUCT_VERSION="${RELEASE_TAG#webgl-}"

          if [[ -z "$LOADER_FILE" || -z "$DATA_FILE" || -z "$FRAMEWORK_FILE" || -z "$WASM_FILE" ]]; then
            echo "Could not resolve one or more Unity WebGL build files." >&2
            find site/Build -maxdepth 1 -type f -printf '%f\n' >&2
            exit 1
          fi

          sed -i \
            -e "s|__LOADER_FILE__|$LOADER_FILE|g" \
            -e "s|__DATA_FILE__|$DATA_FILE|g" \
            -e "s|__FRAMEWORK_FILE__|$FRAMEWORK_FILE|g" \
            -e "s|__WASM_FILE__|$WASM_FILE|g" \
            -e "s|__PRODUCT_VERSION__|$PRODUCT_VERSION|g" \
            site/index.html

          echo "Loader: $LOADER_FILE"
          echo "Data: $DATA_FILE"
          echo "Framework: $FRAMEWORK_FILE"
          echo "Wasm: $WASM_FILE"

          touch site/.nojekyll
          test -f site/index.html
          test -d site/Build
          test -d site/TemplateData

          echo "Publishing WebGL root: $WEBGL_ROOT"
          du -sh site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
