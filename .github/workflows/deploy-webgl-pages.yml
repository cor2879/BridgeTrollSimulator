name: Deploy Bridge Troll Simulator WebGL

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag containing the WebGL zip"
        required: true
        default: "webgl-0.1.2"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Download WebGL release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release unpacked site

          gh release download "$RELEASE_TAG" \
            --pattern 'BridgeTrollSimulator.*-WebGL*.zip' \
            --dir release

          ZIP_FILE="$(find release -maxdepth 1 -type f -name '*.zip' -print -quit)"

          if [[ -z "$ZIP_FILE" ]]; then
            echo "No Bridge Troll Simulator WebGL zip found on release '$RELEASE_TAG'." >&2
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d unpacked

          INDEX_FILE="$(find unpacked -type f -name index.html -print -quit)"

          if [[ -z "$INDEX_FILE" ]]; then
            echo "The release zip does not contain index.html." >&2
            exit 1
          fi

          WEBGL_ROOT="$(dirname "$INDEX_FILE")"
          cp -a "$WEBGL_ROOT"/. site/

          # Preserve Unity's generated index.html exactly. This keeps the
          # loader/config contract identical to the locally tested build.
          # Only replace the stylesheet with our mobile-safe sizing rules.
          cp .github/webgl-template/style.css site/TemplateData/style.css

          touch site/.nojekyll
          test -f site/index.html
          test -d site/Build
          test -d site/TemplateData

          echo "Publishing WebGL root: $WEBGL_ROOT"
          du -sh site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
